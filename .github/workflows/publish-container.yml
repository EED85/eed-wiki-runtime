name: Publish wiki runtime

on:
  push:
    tags:
      - "*.*.*"
  repository_dispatch:
    types: [sandbox-image-published]
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Runtime image tag to publish
        required: true
        default: "0.1.0"
      sandbox_version:
        description: Pinned eed-mistral-sandbox image version
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select image versions
        id: versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.image_tag }}
          INPUT_RUNTIME_TAG: ${{ inputs.runtime_tag }}
          INPUT_SANDBOX_VERSION: ${{ inputs.sandbox_version }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            runtime_tag="sandbox-${DISPATCH_VERSION}"
            sandbox_version="$DISPATCH_VERSION"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            runtime_tag="$INPUT_RUNTIME_TAG"
            sandbox_version="$INPUT_SANDBOX_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            runtime_tag="$REF_NAME"
            sandbox_version="1.0.0"
          else
            echo "::error::Publish must run from a version tag or an explicit workflow dispatch."
            exit 1
          fi

          if ! printf '%s' "$sandbox_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid sandbox version: $sandbox_version"
            exit 1
          fi
          if ! printf '%s' "$runtime_tag" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::Invalid runtime tag: $runtime_tag"
            exit 1
          fi

          echo "runtime_tag=$runtime_tag" >> "$GITHUB_OUTPUT"
          echo "sandbox_version=$sandbox_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SANDBOX_VERSION=${{ steps.versions.outputs.sandbox_version }}
          tags: ghcr.io/eed85/eed-wiki-runtime:${{ steps.versions.outputs.runtime_tag }}
          labels: |
            org.opencontainers.image.title=eed-wiki-runtime
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.eed.sandbox.version=${{ steps.versions.outputs.sandbox_version }}
